<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBI – Notice Board India</title>
  <meta name="description" content="Notice Board India - Educational Notice Board Application">

  <!-- Style Sheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Splash Screen Container -->
  <main class="splash-container" id="splash-screen">
    
    <!-- Top-Left Organic Orange Shape -->
    <img src="assets/images/Splash-1.png" alt="" class="bg-shape top-left" aria-hidden="true">

    <!-- Bottom-Right Organic Orange Shape -->
    <img src="assets/images/Splash-2.png" alt="" class="bg-shape bottom-right" aria-hidden="true">

    <!-- Center Content -->
    <div class="splash-content">
      
      <!-- Central Blackboard Logo -->
      <div class="splash-logo-wrapper">
        <img src="assets/logos/Logo.png" alt="NBI Notice Board" class="splash-logo">
      </div>

      <!-- NBI Typography Branding -->
      <h1 class="splash-title">
        <span class="text-orange">NOTICE BOARD</span> <span class="text-black">INDIA</span>
      </h1>

    </div>

  </main>

  <!-- JavaScript -->
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
