<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Class & Division – NBI (Notice Board India)</title>
  <meta name="description"
    content="Select class and division for your child's educational institution on Notice Board India.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Style Sheets -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/select-class-division.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body class="class-division-select-page">

  <!-- TOP SECTION (Background: #FEF8F5) -->
  <div class="top-hero-wrapper">

    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="header-container">

        <!-- Centered Branding -->
        <div class="header-brand">
          <img src="../assets/logos/Logo.png" alt="NBI Logo" class="brand-logo">
          <span class="brand-title">
            <span class="text-orange">Notice Board</span> <span class="text-black">India</span>
          </span>
        </div>

      </div>
    </header>

    <!-- Hero Banner Section -->
    <section class="search-hero-section">
      <div class="hero-inner-container">

        <!-- Left Column: Step Tag, Heading & Subtitle -->
        <div class="search-hero-left">
          <span class="step-badge">Step 2 of 2</span>
          <h1 class="hero-heading">Find Your Educational Institutions</h1>
          <p class="hero-subtext">Search for your child's school to get started.</p>
        </div>

        <!-- Right Column: School Building Illustration -->
        <div class="search-hero-right">
          <img src="../assets/images/Loginimg-2.png" alt="Educational Institution Building Illustration"
            class="school-hero-illustration">
        </div>

      </div>
    </section>

  </div>

  <!-- BOTTOM SECTION (Background: #FFFFFF) -->
  <main class="bottom-cards-wrapper">
    <div class="cards-inner-container">

      <!-- Followed Schools Class & Division Selection Cards Grid -->
      <section class="cards-grid-section">

        <div class="institution-grid" id="classDivisionGrid">
          <!-- Dynamically populated from Step 1 followed institutions JS state -->
        </div>

      </section>

    </div>

    <!-- Sticky Bottom Action Bar / Next Button (Hidden initially until selection is made) -->
    <footer class="bottom-action-bar">
      <div class="bottom-action-container">
        <div class="selection-status-text" id="selectionStatus">
          Select class and division for your school to continue
        </div>
        <button type="button" class="btn-next-step" id="btnNextStep">
          <span>Next</span>
        </button>
      </div>
    </footer>

  </main>

  <!-- JavaScript Components & Logic -->
  <script src="../js/components.js"></script>
  <script src="../js/select-class-division.js"></script>
</body>

</html>
